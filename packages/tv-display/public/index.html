<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArchClaude — Game Table</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Top bar: initiative tracker -->
    <div id="initiative-bar">
      <h3>Initiative</h3>
      <div id="initiative-list"></div>
    </div>

    <div id="main-area">
      <!-- Left: battle map (shown during combat) -->
      <div id="map-container">
        <canvas id="map-canvas"></canvas>
        <div id="no-map-message">Theater of the Mind</div>
      </div>

      <!-- Right: narration log (always visible) -->
      <div id="narration-panel">
        <h3>DM Narration</h3>
        <div id="narration-log"></div>
      </div>
    </div>

    <!-- Bottom: party status bar -->
    <div id="party-bar">
      <div id="party-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
