version: "3.9"

services:
  archclaude-metabase:
    image: metabase/metabase:latest
    container_name: archclaude-metabase
    ports:
      - "3007:3000"
    volumes:
      # Campaign database (rw needed — SQLite requires write for WAL journal/locks)
      - ../examples/starter-campaign:/campaign
      # SRD bestiary database
      - ~/.archclaude/srd-cache:/srd-cache
      # Metabase internal data (persist settings/dashboards)
      - archclaude-metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    restart: unless-stopped

volumes:
  archclaude-metabase-data:
